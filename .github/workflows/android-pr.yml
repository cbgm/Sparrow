name: Android PR Check

on:
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Build Android App
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        env:
          CONTROL_PLANE_DIRECTORY_URL: ${{ vars.CONTROL_PLANE_DIRECTORY_URL }}
        run: |
          if [ -z "$CONTROL_PLANE_DIRECTORY_URL" ]; then
            echo "::error::Set the CONTROL_PLANE_DIRECTORY_URL repository variable."
            exit 1
          fi
          printf 'controlPlaneDirectoryUrl=%s\n' "$CONTROL_PLANE_DIRECTORY_URL" > local.properties

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace --console=plain

      - name: Upload Android Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sparrow-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        env:
          CONTROL_PLANE_DIRECTORY_URL: ${{ vars.CONTROL_PLANE_DIRECTORY_URL }}
        run: |
          if [ -z "$CONTROL_PLANE_DIRECTORY_URL" ]; then
            echo "::error::Set the CONTROL_PLANE_DIRECTORY_URL repository variable."
            exit 1
          fi
          printf 'controlPlaneDirectoryUrl=%s\n' "$CONTROL_PLANE_DIRECTORY_URL" > local.properties

      - name: Run Quality Checks
        run: ./gradlew qualityCheck -x verifyArchitectureReport --no-daemon --stacktrace --console=plain

      - name: Run Host and Multiplatform Tests
        run: ./gradlew allTests --no-daemon --stacktrace --console=plain

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          if-no-files-found: ignore
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/detekt/**
            **/build/reports/ktlint/**

  android-device-tests:
    name: Android Device Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        env:
          CONTROL_PLANE_DIRECTORY_URL: ${{ vars.CONTROL_PLANE_DIRECTORY_URL }}
        run: |
          if [ -z "$CONTROL_PLANE_DIRECTORY_URL" ]; then
            echo "::error::Set the CONTROL_PLANE_DIRECTORY_URL repository variable."
            exit 1
          fi
          printf 'controlPlaneDirectoryUrl=%s\n' "$CONTROL_PLANE_DIRECTORY_URL" > local.properties

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Device Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: >
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          script: ./gradlew connectedCheck --no-daemon --stacktrace --console=plain

      - name: Upload Android Device Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-test-reports
          if-no-files-found: ignore
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
