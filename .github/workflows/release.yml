name: Release Packages

on:
  push:
    branches:
      - "release/**"
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"

jobs:
  changes:
    name: Resolve changed artifacts
    runs-on: ubuntu-latest
    outputs:
      full_build: ${{ steps.changes.outputs.full_build }}
      android: ${{ steps.changes.outputs.android }}
      node_registry: ${{ steps.changes.outputs.node_registry }}
      presence_directory: ${{ steps.changes.outputs.presence_directory }}
      push: ${{ steps.changes.outputs.push }}
      mailbox: ${{ steps.changes.outputs.mailbox }}
      federation: ${{ steps.changes.outputs.federation }}
      gateway: ${{ steps.changes.outputs.gateway }}
      control_plane_package: ${{ steps.changes.outputs.control_plane_package }}
      community_node_package: ${{ steps.changes.outputs.community_node_package }}
      any_artifacts: ${{ steps.changes.outputs.any_artifacts }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect affected release artifacts
        id: changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          FORCE_FULL: ${{ github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          bash .github/scripts/resolve-release-changes.sh \
            "${BEFORE_SHA}" \
            "${GITHUB_SHA}" \
            "${FORCE_FULL}"

  metadata:
    name: Resolve release metadata
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.metadata.outputs.version_name }}
      version_code: ${{ steps.metadata.outputs.version_code }}
      artifact_version: ${{ steps.metadata.outputs.artifact_version }}
      image_tag: ${{ steps.metadata.outputs.image_tag }}
      release_line_tag: ${{ steps.metadata.outputs.release_line_tag }}
      short_sha: ${{ steps.metadata.outputs.short_sha }}
      publish_release: ${{ steps.metadata.outputs.publish_release }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}

    steps:
      - name: Resolve version and image tags
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA:0:8}"
          version_code="${GITHUB_RUN_NUMBER}"
          publish_release="false"
          prerelease="true"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9][A-Za-z0-9.-]*)?$ ]]; then
              echo "::error::Release tags must look like v0.1.0 or v0.1.0-alpha.1."
              exit 1
            fi

            version_name="${GITHUB_REF_NAME#v}"
            artifact_version="${version_name}"
            image_tag="${GITHUB_REF_NAME}"
            release_major="${version_name%%.*}"
            release_remainder="${version_name#*.}"
            release_minor="${release_remainder%%.*}"
            release_line_tag="release-${release_major}-${release_minor}"
            publish_release="true"

            if [[ "${version_name}" != *-* ]]; then
              prerelease="false"
            fi
          else
            release_line="${GITHUB_REF_NAME#release/}"
            if [[ "${release_line}" == "${GITHUB_REF_NAME}" ]] ||
               [[ ! "${release_line}" =~ ^[0-9]+\.[0-9]+([.][0-9]+)?$ ]]; then
              echo "::error::Release branches must be created from master and named release/0.1 or release/0.1.0."
              exit 1
            fi

            version_name="${release_line}-rc.${GITHUB_RUN_NUMBER}"
            artifact_version="${version_name}-${short_sha}"
            image_line="${release_line//./-}"
            release_line_tag="release-${image_line}"
            image_tag="${release_line_tag}-sha-${short_sha}"
          fi

          if (( version_code > 2100000000 )); then
            echo "::error::GitHub run number no longer fits into Android versionCode."
            exit 1
          fi

          {
            echo "version_name=${version_name}"
            echo "version_code=${version_code}"
            echo "artifact_version=${artifact_version}"
            echo "image_tag=${image_tag}"
            echo "release_line_tag=${release_line_tag}"
            echo "short_sha=${short_sha}"
            echo "publish_release=${publish_release}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

          echo "Version: ${version_name}"
          echo "Immutable image tag: ${image_tag}"
          echo "Release-line image tag: ${release_line_tag}"

  validate:
    name: Validate release commit
    needs:
      - changes
      - metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify tagged commit belongs to a release branch
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/release/*:refs/remotes/origin/release/*'
          if ! git branch --remotes --contains "${GITHUB_SHA}" | grep -Eq 'origin/release/'; then
            echo "::error::Release tags must point to a commit from a release/* branch."
            exit 1
          fi

      - name: Create validation local.properties
        env:
          CONTROL_PLANE_RELEASE_DIRECTORY_URL: ${{ vars.CONTROL_PLANE_RELEASE_DIRECTORY_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CONTROL_PLANE_RELEASE_DIRECTORY_URL:-}" ]]; then
            echo "::error::Set the CONTROL_PLANE_RELEASE_DIRECTORY_URL repository variable."
            exit 1
          fi

          printf 'CONTROL_PLANE_RELEASE_DIRECTORY_URL=%s\n' \
            "${CONTROL_PLANE_RELEASE_DIRECTORY_URL}" \
            > local.properties

      - name: Run quality checks
        run: ./gradlew qualityCheck -x verifyArchitectureReport --no-daemon --stacktrace --console=plain

      - name: Run host and multiplatform tests
        run: ./gradlew allTests --no-daemon --stacktrace --console=plain

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ needs.metadata.outputs.artifact_version }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/detekt/**
            **/build/reports/ktlint/**

  android-debug-package:
    name: Build debug APK
    needs:
      - changes
      - metadata
      - validate
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Create debug local.properties
        env:
          CONTROL_PLANE_RELEASE_DIRECTORY_URL: ${{ vars.CONTROL_PLANE_RELEASE_DIRECTORY_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CONTROL_PLANE_RELEASE_DIRECTORY_URL:-}" ]]; then
            echo "::error::Set the CONTROL_PLANE_RELEASE_DIRECTORY_URL repository variable."
            exit 1
          fi

          printf 'CONTROL_PLANE_DIRECTORY_URL=%s\n' \
            "${CONTROL_PLANE_RELEASE_DIRECTORY_URL}" \
            > local.properties

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :androidApp:assembleDebug \
            -PappVersionName="${{ needs.metadata.outputs.version_name }}" \
            -PappVersionCode="${{ needs.metadata.outputs.version_code }}" \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Name debug APK
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.metadata.outputs.artifact_version }}"
          debug_apk="$(find androidApp/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          if [[ -z "${debug_apk}" ]]; then
            echo "::error::Android debug APK output is missing."
            exit 1
          fi
          mkdir -p dist/android-debug
          cp "${debug_apk}" "dist/android-debug/sparrow-${version}-debug.apk"
          (cd dist/android-debug && sha256sum sparrow-*.apk > SHA256SUMS.txt)

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sparrow-android-debug-${{ needs.metadata.outputs.artifact_version }}
          path: dist/android-debug
          if-no-files-found: error
          retention-days: 30

  android-release-package:
    name: Build signed release APK
    needs:
      - changes
      - metadata
      - validate
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Create release local.properties
        env:
          CONTROL_PLANE_RELEASE_DIRECTORY_URL: ${{ vars.CONTROL_PLANE_RELEASE_DIRECTORY_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CONTROL_PLANE_RELEASE_DIRECTORY_URL:-}" ]]; then
            echo "::error::Set the CONTROL_PLANE_RELEASE_DIRECTORY_URL repository variable."
            exit 1
          fi

          printf 'CONTROL_PLANE_RELEASE_DIRECTORY_URL=%s\n' \
            "${CONTROL_PLANE_RELEASE_DIRECTORY_URL}" \
            > local.properties

      - name: Prepare release signing key
        env:
          KEY_STORE_FILE: ${{ secrets.KEY_STORE_FILE }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          for variable in \
            KEY_STORE_FILE \
            KEY_STORE_PASSWORD \
            KEY_ALIAS \
            KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Missing required GitHub secret ${variable}."
              exit 1
            fi
          done

          keystore="${RUNNER_TEMP}/sparrow-release-key.jks"

          if ! printf '%s' "${KEY_STORE_FILE}" | base64 --decode > "${keystore}"; then
            echo "::error::KEY_STORE_FILE is not valid Base64."
            exit 1
          fi

          chmod 600 "${keystore}"

          if [[ ! -s "${keystore}" ]]; then
            echo "::error::Decoded release keystore is empty."
            exit 1
          fi

          echo "Validating decoded release keystore..."

          if ! keytool -list \
            -keystore "${keystore}" \
            -storepass "${KEY_STORE_PASSWORD}" \
            >/dev/null; then
            echo "::error::The decoded KEY_STORE_FILE is not a readable keystore with KEY_STORE_PASSWORD."
            exit 1
          fi

          echo "Validating release key alias..."

          if ! keytool -list \
            -keystore "${keystore}" \
            -storepass "${KEY_STORE_PASSWORD}" \
            -alias "${KEY_ALIAS}" \
            >/dev/null; then
            echo "::error::The keystore opened successfully, but KEY_ALIAS was not found."
            exit 1
          fi

          {
            echo "KEY_STORE_FILE=${keystore}"
            echo "KEY_STORE_PASSWORD=${KEY_STORE_PASSWORD}"
            echo "KEY_ALIAS=${KEY_ALIAS}"
            echo "KEY_PASSWORD=${KEY_PASSWORD}"
          } >> local.properties

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :androidApp:assembleRelease \
            -Pbuildkonfig.flavor=release \
            -PappVersionName="${{ needs.metadata.outputs.version_name }}" \
            -PappVersionCode="${{ needs.metadata.outputs.version_code }}" \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify release BuildKonfig
        env:
          CONTROL_PLANE_RELEASE_DIRECTORY_URL: ${{ vars.CONTROL_PLANE_RELEASE_DIRECTORY_URL }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated BuildKonfig files:"
          find shared/build -type f -name 'BuildKonfig*' -print || true

          if ! grep -R -F -q \
            -- "${CONTROL_PLANE_RELEASE_DIRECTORY_URL}" \
            shared/build/generated 2>/dev/null; then
            echo "::error::CONTROL_PLANE_RELEASE_DIRECTORY_URL was not compiled into BuildKonfig."
            echo "::error::Refusing to publish a release APK with no Control Plane bootstrap configured."
            exit 1
          fi

          echo "Release Control Plane directory URL is present in generated BuildKonfig."

      - name: Verify and name release APK
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.metadata.outputs.artifact_version }}"
          release_apk="$(find androidApp/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          if [[ -z "${release_apk}" ]]; then
            echo "::error::Android release APK output is missing."
            exit 1
          fi

          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "${apksigner}" ]]; then
            echo "::error::Could not find Android apksigner."
            exit 1
          fi
          "${apksigner}" verify --verbose --print-certs "${release_apk}"

          mkdir -p dist/android-release
          cp "${release_apk}" "dist/android-release/sparrow-${version}-release.apk"
          (cd dist/android-release && sha256sum sparrow-*.apk > SHA256SUMS.txt)

          mapping_file="androidApp/build/outputs/mapping/release/mapping.txt"
          if [[ ! -s "${mapping_file}" ]]; then
            echo "::error::R8 mapping output is missing for the minified release build."
            exit 1
          fi
          mkdir -p dist/android-mapping
          cp "${mapping_file}" "dist/android-mapping/mapping-${version}.txt"

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: sparrow-android-mapping-${{ needs.metadata.outputs.artifact_version }}
          path: dist/android-mapping
          if-no-files-found: error
          retention-days: 90

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: sparrow-android-release-${{ needs.metadata.outputs.artifact_version }}
          path: dist/android-release
          if-no-files-found: error
          retention-days: 30

  server-artifacts:
    name: Build server images and bundles
    needs:
      - changes
      - metadata
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image rebuild and alias plan
        id: image-plan
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.metadata.outputs.image_tag }}
          RELEASE_LINE_TAG: ${{ needs.metadata.outputs.release_line_tag }}
          CHANGE_NODE_REGISTRY: ${{ needs.changes.outputs.node_registry }}
          CHANGE_PRESENCE_DIRECTORY: ${{ needs.changes.outputs.presence_directory }}
          CHANGE_PUSH: ${{ needs.changes.outputs.push }}
          CHANGE_MAILBOX: ${{ needs.changes.outputs.mailbox }}
          CHANGE_FEDERATION: ${{ needs.changes.outputs.federation }}
          CHANGE_GATEWAY: ${{ needs.changes.outputs.gateway }}
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_prefix="ghcr.io/${owner}/sparrow"
          # Every release candidate must have a complete immutable server image set
          # because both launcher bundles are always produced. Only changed services
          # are rebuilt; unchanged services are reused or aliased from the release line.
          required=(
            node-registry
            presence-directory
            push
            mailbox
            federation
            gateway
          )

          rebuild=()
          alias=()
          reuse=()

          for service in "${required[@]}"; do
            variable_name="CHANGE_${service^^}"
            variable_name="${variable_name//-/_}"
            changed="${!variable_name:-false}"
            image="${image_prefix}-${service}"

            if [[ "${changed}" == "true" ]]; then
              rebuild+=("${service}")
              continue
            fi

            if docker buildx imagetools inspect "${image}:${IMAGE_TAG}" >/dev/null 2>&1; then
              reuse+=("${service}")
            elif docker buildx imagetools inspect "${image}:${RELEASE_LINE_TAG}" >/dev/null 2>&1; then
              alias+=("${service}")
            else
              echo "No ${RELEASE_LINE_TAG} base image exists for ${service}; bootstrapping it now."
              rebuild+=("${service}")
            fi
          done

          {
            echo "rebuild_services=${rebuild[*]}"
            echo "alias_services=${alias[*]}"
            echo "reuse_services=${reuse[*]}"
          } >> "${GITHUB_OUTPUT}"

          echo "Rebuild: ${rebuild[*]:-none}"
          echo "Alias only: ${alias[*]:-none}"
          echo "Reuse existing candidate: ${reuse[*]:-none}"

      - name: Build changed server distributions
        if: steps.image-plan.outputs.rebuild_services != ''
        shell: bash
        env:
          REBUILD_SERVICES: ${{ steps.image-plan.outputs.rebuild_services }}
        run: |
          set -euo pipefail
          tasks=()
          for service in ${REBUILD_SERVICES}; do
            tasks+=(":server:${service}:installDist")
          done

          ./gradlew \
            "${tasks[@]}" \
            --no-daemon \
            --no-configuration-cache \
            --max-workers=2 \
            --console=plain

      - name: Publish rebuilt images
        if: steps.image-plan.outputs.rebuild_services != ''
        shell: bash
        env:
          REBUILD_SERVICES: ${{ steps.image-plan.outputs.rebuild_services }}
          IMAGE_TAG: ${{ needs.metadata.outputs.image_tag }}
          RELEASE_LINE_TAG: ${{ needs.metadata.outputs.release_line_tag }}
          VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_prefix="ghcr.io/${owner}/sparrow"
          created_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          context_root="${RUNNER_TEMP}/sparrow-release-images"
          rm -rf "${context_root}"
          mkdir -p "${context_root}"

          for service in ${REBUILD_SERVICES}; do
            distribution="server/${service}/build/install/${service}"
            if [[ ! -f "${distribution}/bin/${service}" ]]; then
              echo "::error::Missing server distribution ${distribution}."
              exit 1
            fi

            context="${context_root}/${service}"
            mkdir -p "${context}/app" "${context}/data"
            cp -a "${distribution}/." "${context}/app/"
            touch "${context}/data/.keep"
            cp server/Dockerfile.runtime "${context}/Dockerfile"

            image="${image_prefix}-${service}"
            echo "Publishing ${image}:${IMAGE_TAG}"

            docker buildx build \
              --file "${context}/Dockerfile" \
              --platform linux/amd64,linux/arm64 \
              --build-arg "SERVICE=${service}" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.version=${VERSION_NAME}" \
              --label "org.opencontainers.image.created=${created_at}" \
              --provenance=false \
              --push \
              --tag "${image}:${IMAGE_TAG}" \
              --tag "${image}:${RELEASE_LINE_TAG}" \
              "${context}"
          done

      - name: Copy unchanged image manifests to immutable candidate tag
        if: steps.image-plan.outputs.alias_services != ''
        shell: bash
        env:
          ALIAS_SERVICES: ${{ steps.image-plan.outputs.alias_services }}
          IMAGE_TAG: ${{ needs.metadata.outputs.image_tag }}
          RELEASE_LINE_TAG: ${{ needs.metadata.outputs.release_line_tag }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_prefix="ghcr.io/${owner}/sparrow"

          for service in ${ALIAS_SERVICES}; do
            image="${image_prefix}-${service}"
            echo "Copying ${image}:${RELEASE_LINE_TAG} -> ${image}:${IMAGE_TAG} without rebuilding."
            docker buildx imagetools create \
              --tag "${image}:${IMAGE_TAG}" \
              "${image}:${RELEASE_LINE_TAG}"
          done

      - name: Build unified server installer
        shell: pwsh
        env:
          IMAGE_TAG: ${{ needs.metadata.outputs.image_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $owner = "${{ github.repository_owner }}".ToLowerInvariant()
          $imagePrefix = "ghcr.io/$owner/sparrow"

          ./server/unified/New-SparrowServerBundle.ps1 `
              -OutputDirectory dist-server `
              -ImagePrefix $imagePrefix `
              -ImageTag $env:IMAGE_TAG

          $bundle = 'dist-server/sparrow-server.zip'
          if (-not (Test-Path -LiteralPath $bundle -PathType Leaf)) {
              throw 'Unified server installer was not created.'
          }
          # The public release exposes exactly two server ZIPs: Windows and Linux.

      - name: Validate and prepare public unified server artifacts
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist/server/windows dist/server/linux
          mkdir -p dist/server/windows dist/server/linux
          unzip -q dist-server/sparrow-server.zip -d dist/server/windows

          required=(
            Start-SparrowServer.cmd
            Start-SparrowServer.sh
            Start-SparrowServer.command
            Invoke-SparrowServer.py
            Manage-SparrowNodes.py
            control_plane_directory_client.py
            control_plane_directory_registration.py
            control_plane_directory_sync.py
            directory-registration/Dockerfile
            directory-sync/Dockerfile
            public-proxy/docker-compose.yml
            control-plane/docker-compose.yml
            control-plane/docker-compose.release.yml
            control-plane/docker-compose.production.yml
            control-plane/docker-compose.shared-proxy.yml
            control-plane/docker-compose.firebase.yml
            community-node/docker-compose.yml
            community-node/docker-compose.release.yml
            community-node/docker-compose.production.yml
            community-node/docker-compose.shared-proxy.yml
            community-node/docker-compose.directory-sync.yml
          )

          for required_file in "${required[@]}"; do
            if [[ ! -f "dist/server/windows/${required_file}" ]]; then
              echo "::error::Public unified installer is missing ${required_file}." >&2
              exit 1
            fi
          done

          # The release may contain Directory CLIENT/SYNC support, but never the
          # independently operated Control Plane Directory server or its admin tooling.
          forbidden_names=(
            directory_service.py
            directory_admin_cli.py
            Build-SparrowDirectoryInstaller.py
            Start-SparrowDirectory.cmd
            Start-SparrowDirectory.ps1
            Start-SparrowDirectory.sh
          )

          if find dist/server/windows -type d \
              \( -path '*/control-plane-directory' -o -path '*/server/control-plane-directory' \) \
              -print -quit | grep -q .; then
            echo "::error::Internal Control Plane Directory directory leaked into the public release bundle." >&2
            exit 1
          fi

          for forbidden_name in "${forbidden_names[@]}"; do
            if find dist/server/windows -type f -name "${forbidden_name}" -print -quit | grep -q .; then
              echo "::error::Internal Directory file ${forbidden_name} leaked into the public release bundle." >&2
              exit 1
            fi
          done

          cp -a dist/server/windows/. dist/server/linux/

      - name: Upload unified Windows server installer
        uses: actions/upload-artifact@v4
        with:
          name: sparrow-server-${{ needs.metadata.outputs.artifact_version }}-windows
          path: dist/server/windows
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

      - name: Upload unified Linux server installer
        uses: actions/upload-artifact@v4
        with:
          name: sparrow-server-${{ needs.metadata.outputs.artifact_version }}-linux
          path: dist/server/linux
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

  release-summary:
    name: Release candidate summary
    needs:
      - changes
      - metadata
      - validate
      - android-debug-package
      - android-release-package
      - server-artifacts
    if: always() && needs.validate.result == 'success' && github.ref_type != 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Summarize generated artifacts
        shell: bash
        run: |
          {
            echo "## Release candidate ${{ needs.metadata.outputs.version_name }}"
            echo
            echo "Immutable server image tag: \`${{ needs.metadata.outputs.image_tag }}\`"
            echo
            echo "Unified public server installer packaged for Windows and Linux (Control Plane + Community Node; internal Directory server excluded)."
            echo "Only changed server images were rebuilt; unchanged images were reused or aliased to the immutable candidate tag."
          } >> "${GITHUB_STEP_SUMMARY}"

  publish-release:
    name: Publish full GitHub release
    needs:
      - changes
      - metadata
      - validate
      - android-debug-package
      - android-release-package
      - server-artifacts
    if: >-
      always() &&
      needs.metadata.outputs.publish_release == 'true' &&
      needs.validate.result == 'success' &&
      needs.android-debug-package.result == 'success' &&
      needs.android-release-package.result == 'success' &&
      needs.server-artifacts.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: sparrow-android-debug-${{ needs.metadata.outputs.artifact_version }}
          path: downloads/debug

      - name: Download signed release APK
        uses: actions/download-artifact@v4
        with:
          name: sparrow-android-release-${{ needs.metadata.outputs.artifact_version }}
          path: downloads/release

      - name: Download unified Windows server installer
        uses: actions/download-artifact@v4
        with:
          name: sparrow-server-${{ needs.metadata.outputs.artifact_version }}-windows
          path: downloads/server-windows

      - name: Download unified Linux server installer
        uses: actions/download-artifact@v4
        with:
          name: sparrow-server-${{ needs.metadata.outputs.artifact_version }}-linux
          path: downloads/server-linux

      - name: Assemble exactly two public server ZIP assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.metadata.outputs.artifact_version }}"
          mkdir -p dist

          find downloads/debug -type f -name 'sparrow-*-debug.apk' -exec cp '{}' dist/ ';'
          find downloads/release -type f -name 'sparrow-*-release.apk' -exec cp '{}' dist/ ';'

          chmod +x \
            downloads/server-linux/Start-SparrowServer.sh \
            downloads/server-linux/Start-SparrowServer.command \
            downloads/server-linux/community-node/bootstrap-community-node.sh \
            downloads/server-linux/community-node/start-sparrow-node.sh \
            downloads/server-linux/community-node/Start-SparrowNode.command \
            downloads/server-linux/control-plane/bootstrap-control-plane.sh \
            downloads/server-linux/control-plane/start-sparrow-control-plane.sh \
            downloads/server-linux/control-plane/Start-SparrowControlPlane.command

          (cd downloads/server-windows && zip -qr "$GITHUB_WORKSPACE/dist/sparrow-server-${version}-windows.zip" .)
          (cd downloads/server-linux && zip -qr "$GITHUB_WORKSPACE/dist/sparrow-server-${version}-linux.zip" .)

          test -s "dist/sparrow-server-${version}-windows.zip"
          test -s "dist/sparrow-server-${version}-linux.zip"

          server_zip_count="$(find dist -maxdepth 1 -type f -name 'sparrow-server-*.zip' | wc -l)"
          if [[ "${server_zip_count}" -ne 2 ]]; then
            echo "::error::Expected exactly 2 public server ZIPs, found ${server_zip_count}." >&2
            find dist -maxdepth 1 -type f -print
            exit 1
          fi

          cat > dist/RELEASE.txt <<EOF_RELEASE
          Sparrow ${{ needs.metadata.outputs.version_name }}
          Commit: ${GITHUB_SHA}
          Server image tag: ${{ needs.metadata.outputs.image_tag }}

          Server bundles:
          - sparrow-server-${version}-windows.zip (unified server, no internal Directory)
          - sparrow-server-${version}-linux.zip (unified server, no internal Directory)
          EOF_RELEASE

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum sparrow-* > SHA256SUMS.txt

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          set -euo pipefail

          prerelease_argument=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            prerelease_argument+=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Sparrow ${{ needs.metadata.outputs.version_name }}" \
            --generate-notes \
            "${prerelease_argument[@]}"

