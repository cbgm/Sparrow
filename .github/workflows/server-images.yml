name: Server Images

on:
  push:
    branches: [ "master" ]
    tags: [ "server-v*" ]
    paths:
      - "server/**"
      - "build-logic/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/server-images.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional additional image tag
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: server-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-images:
    name: Publish server images
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      image_prefix: ${{ steps.image-tags.outputs.image_prefix }}
      bundle_image_tag: ${{ steps.image-tags.outputs.bundle_image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: image-tags
        env:
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_prefix="ghcr.io/${owner}/sparrow"
          image_tags=("sha-${GITHUB_SHA}")
          bundle_image_tag="sha-${GITHUB_SHA}"

          if [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
            image_tags+=("latest")
            bundle_image_tag="latest"
          fi

          if [[ "$GITHUB_REF" == refs/tags/server-v* ]]; then
            image_tags+=("$GITHUB_REF_NAME")
            bundle_image_tag="$GITHUB_REF_NAME"
          fi

          if [[ -n "${REQUESTED_IMAGE_TAG:-}" ]]; then
            if [[ ! "$REQUESTED_IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "Invalid Docker image tag: $REQUESTED_IMAGE_TAG" >&2
              exit 1
            fi
            image_tags+=("$REQUESTED_IMAGE_TAG")
            bundle_image_tag="$REQUESTED_IMAGE_TAG"
          fi

          {
            echo "image_prefix=${image_prefix}"
            echo "bundle_image_tag=${bundle_image_tag}"
            echo "image_tags=${image_tags[*]}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish all service images
        env:
          IMAGE_PREFIX: ${{ steps.image-tags.outputs.image_prefix }}
          IMAGE_TAGS: ${{ steps.image-tags.outputs.image_tags }}
        shell: bash
        run: |
          set -euo pipefail

          created_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          services=(
            node-registry
            presence-directory
            push
            mailbox
            federation
            gateway
          )

          for service in "${services[@]}"; do
            image="${IMAGE_PREFIX}-${service}"
            tag_arguments=()
            for tag in ${IMAGE_TAGS}; do
              tag_arguments+=(--tag "${image}:${tag}")
            done

            docker buildx build \
              --file server/Dockerfile \
              --platform linux/amd64,linux/arm64 \
              --build-arg "SERVICE=${service}" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.created=${created_at}" \
              --cache-from type=gha,scope=sparrow-server-images \
              --cache-to type=gha,mode=max,scope=sparrow-server-images \
              --provenance=true \
              --sbom=true \
              --push \
              "${tag_arguments[@]}" \
              .
          done

  deployment-bundles:
    name: Deployment bundles
    needs: publish-images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create unified Sparrow server bundle
        shell: pwsh
        env:
          IMAGE_PREFIX: ${{ needs.publish-images.outputs.image_prefix }}
          IMAGE_TAG: ${{ needs.publish-images.outputs.bundle_image_tag }}
          CONTROL_PLANE_RELEASE_DIRECTORY_URL: ${{ vars.CONTROL_PLANE_RELEASE_DIRECTORY_URL }}
          CONTROL_PLANE_DIRECTORY_PUBLIC_KEY: ${{ vars.CONTROL_PLANE_DIRECTORY_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          ./server/unified/New-SparrowServerBundle.ps1 `
              -OutputDirectory dist-server `
              -ImagePrefix $env:IMAGE_PREFIX `
              -ImageTag $env:IMAGE_TAG

          if (-not (Test-Path -LiteralPath 'dist-server/sparrow-server.zip' -PathType Leaf)) {
              throw 'Unified Sparrow server bundle was not created.'
          }

      - name: Verify unified public bundle
        shell: python
        run: |
          import sys
          import zipfile
          from pathlib import Path

          bundle = Path("dist-server/sparrow-server.zip")
          required = {
              "Start-SparrowServer.cmd",
              "Start-SparrowServer.sh",
              "Start-SparrowServer.command",
              "Invoke-SparrowServer.py",
              "Manage-SparrowNodes.py",
              "control_plane_directory_client.py",
              "control_plane_directory_registration.py",
              "control_plane_directory_sync.py",
              "directory-registration/Dockerfile",
              "directory-sync/Dockerfile",
              "public-proxy/docker-compose.yml",
              "community-node/docker-compose.yml",
              "community-node/docker-compose.release.yml",
              "community-node/docker-compose.production.yml",
              "community-node/docker-compose.shared-proxy.yml",
              "community-node/docker-compose.directory-sync.yml",
              "control-plane/docker-compose.yml",
              "control-plane/docker-compose.release.yml",
              "control-plane/docker-compose.production.yml",
              "control-plane/docker-compose.shared-proxy.yml",
              "control-plane/docker-compose.firebase.yml",
          }
          forbidden_prefixes = (
              "control-plane-directory/",
              "server/control-plane-directory/",
          )
          forbidden_names = {
              "directory_service.py",
              "directory_admin_cli.py",
              "Build-SparrowDirectoryInstaller.py",
              "Start-SparrowDirectory.cmd",
              "Start-SparrowDirectory.ps1",
              "Start-SparrowDirectory.sh",
          }

          with zipfile.ZipFile(bundle) as archive:
              entries = {entry.filename.rstrip("/") for entry in archive.infolist()}

          missing = sorted(required - entries)
          if missing:
              print("Unified Sparrow server bundle is missing required files:", file=sys.stderr)
              for name in missing:
                  print(f"  - {name}", file=sys.stderr)
              raise SystemExit(1)

          leaked = sorted(
              name
              for name in entries
              if any(name.startswith(prefix) for prefix in forbidden_prefixes)
              or Path(name).name in forbidden_names
          )
          if leaked:
              print("Internal Directory server files leaked into the public server bundle:", file=sys.stderr)
              for name in leaked:
                  print(f"  - {name}", file=sys.stderr)
              raise SystemExit(1)

      - name: Prepare Windows and Linux server artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/server-windows dist/server-linux
          mkdir -p dist/server-windows dist/server-linux
          unzip -q dist-server/sparrow-server.zip -d dist/server-windows
          cp -a dist/server-windows/. dist/server-linux/

      - name: Create internal Control Plane Directory installers
        shell: bash
        run: |
          set -euo pipefail

          python3 server/control-plane-directory/Build-SparrowDirectoryInstaller.py \
            --output-dir dist-directory

          rm -rf dist/directory-windows dist/directory-linux
          mkdir -p dist/directory-windows dist/directory-linux
          unzip -q dist-directory/sparrow-directory-windows.zip -d dist/directory-windows
          unzip -q dist-directory/sparrow-directory-linux.zip -d dist/directory-linux

          test -f dist/directory-windows/Start-SparrowDirectory.cmd
          test -f dist/directory-windows/Start-SparrowDirectory.ps1
          test -f dist/directory-windows/directory_service.py
          test -f dist/directory-windows/docker-compose.yml

          test -f dist/directory-linux/Start-SparrowDirectory.sh
          test -f dist/directory-linux/directory_service.py
          test -f dist/directory-linux/docker-compose.yml

      - name: Upload deployment bundles
        uses: actions/upload-artifact@v4
        with:
          name: sparrow-server-deployment-bundles
          path: |
            dist/server-windows
            dist/server-linux
            dist/directory-windows
            dist/directory-linux
          if-no-files-found: error
          include-hidden-files: true

      - name: Package tagged release assets
        if: startsWith(github.ref, 'refs/tags/server-v')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release

          (cd dist/server-windows && zip -qr "$GITHUB_WORKSPACE/dist/release/sparrow-server-windows.zip" .)
          tar -czf dist/release/sparrow-server-linux.tar.gz -C dist/server-linux .
          (cd dist/directory-windows && zip -qr "$GITHUB_WORKSPACE/dist/release/sparrow-directory-windows.zip" .)
          tar -czf dist/release/sparrow-directory-linux.tar.gz -C dist/directory-linux .

      - name: Attach bundles to tagged release
        if: startsWith(github.ref, 'refs/tags/server-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/release/* --clobber
