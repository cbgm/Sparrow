name: Sparrow unified server bundle

on:
  workflow_dispatch:
  push:
    tags:
      - 'server-v*'
    paths:
      - 'server/**'
      - '.github/workflows/sparrow-server-bundle.yml'

permissions:
  contents: read

jobs:
  bundle:
    name: Build ONE unified server bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the cross-platform bundle using the single source builder
        shell: cmd
        run: server\unified\Build-SparrowServer.cmd
      - name: Inspect bundle (fresh template only)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead('dist/sparrow-server.zip')
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName })
            foreach ($name in @('Start-SparrowServer.cmd','Start-SparrowServer.ps1',
                               'Start-SparrowServer.sh','Start-SparrowServer.command',
                               'Invoke-SparrowServer.py','Get-SparrowDockerLabel.ps1',
                               'Update-SparrowFromGitHub.ps1','bundle-source.json','community-node/bootstrap-community-node.sh',
                               'control-plane/bootstrap-control-plane.sh','public-proxy/docker-compose.yml')) {
              if ($name -notin $names) { throw "Bundle missing $name" }
            }
            if (@($names | Where-Object { $_ -match '(^|/)(\.env\.runtime|firebase-admin\.json|\.sparrow-attached\.json)$' }).Count) {
              throw 'Bundle unexpectedly contains runtime credentials or attached deployment state'
            }
          } finally { $archive.Dispose() }
      - name: Publish SINGLE bundle (Windows GUI + Linux/macOS CLI)
        uses: actions/upload-artifact@v4
        with:
          name: sparrow-server-unified
          path: dist/sparrow-server.zip
          if-no-files-found: error

  platform-checks:
    name: Smoke check on ${{ matrix.os }}
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: sparrow-server-unified
          path: downloaded
      - name: Extract the exact same unified ZIP
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then PYTHON=python; else PYTHON=python3; fi
          "$PYTHON" -c 'import zipfile; zipfile.ZipFile("downloaded/sparrow-server.zip").extractall("expanded")'
      - name: Check packaged Python launcher
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then PYTHON=python; else PYTHON=python3; fi
          "$PYTHON" -m py_compile expanded/Invoke-SparrowServer.py
          bash -n expanded/Start-SparrowServer.sh expanded/Start-SparrowServer.command \
            expanded/community-node/bootstrap-community-node.sh \
            expanded/control-plane/bootstrap-control-plane.sh
          bash expanded/Start-SparrowServer.sh
      - name: Test fresh-install guards without touching Docker
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then PYTHON=python; else PYTHON=python3; fi
          "$PYTHON" -m unittest discover -s server/unified/tests -v
      - name: Verify Windows PowerShell 5.1 Docker-label inspection
        if: runner.os == 'Windows'
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File server\unified\tests\Test-DockerLabelInterop.ps1
      - name: Parse Windows PowerShell scripts with the platform parser
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $scripts = @('server/unified/Invoke-SparrowServer.ps1',
                       'server/community-node/Bootstrap-CommunityNode.ps1',
                       'server/unified/Start-SparrowServer.ps1')
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              throw "PowerShell parser rejected ${script}: $($errors | Out-String)"
            }
          }
      - name: Check Windows GUI launcher exists
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path expanded/Start-SparrowServer.cmd)) { throw 'Missing Windows launcher' }

  backend-images:
    # ONE unified workflow still needs six distinct Docker images because the
    # Node and Control Plane are independently scalable backend services.
    # The prior bundle-only workflow never published these images, so the
    # installer's GHCR pull could fail even after a green bundle build.
    name: Publish Sparrow backend images (GHCR)
    needs: [bundle, platform-checks]
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/server-v') ||
       github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish all six backend images
        shell: bash
        env:
          IMAGE_PREFIX: ghcr.io/cbgm/sparrow
        run: |
          set -euo pipefail
          for service in node-registry presence-directory push mailbox federation gateway; do
            tags=(--tag "${IMAGE_PREFIX}-${service}:latest")
            if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
              tags+=(--tag "${IMAGE_PREFIX}-${service}:${GITHUB_REF_NAME}")
            fi
            docker buildx build \
              --file server/Dockerfile \
              --build-arg "SERVICE=${service}" \
              --platform linux/amd64,linux/arm64 \
              "${tags[@]}" \
              --push .
          done

  release:
    name: Publish the SINGLE unified GitHub release asset
    needs: [bundle, platform-checks, backend-images]
    if: startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sparrow-server-unified
          path: dist
      - name: Generate unified release SHA-256
        shell: bash
        run: sha256sum dist/sparrow-server.zip | cut -d ' ' -f 1 > dist/sparrow-server.zip.sha256
      - name: Publish a downloadable GitHub Release, not just an Actions artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/sparrow-server.zip dist/sparrow-server.zip.sha256 \
            --verify-tag --title "Sparrow unified server $GITHUB_REF_NAME" \
            --notes 'Single unified server bundle: Windows GUI and Linux/macOS CLI. Runtime credentials and Docker volumes are not included.'
