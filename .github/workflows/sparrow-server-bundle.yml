name: Sparrow server bundle

on:
  push:
    branches:
      - "**"
    paths:
      - "server/**"
      - "build-logic/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/sparrow-server-bundle.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional GHCR tag for this internal build
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: sparrow-server-bundle-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"

jobs:
  build-internal-server-bundles:
    name: Build internal server bundles
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve internal image tag
        id: images
        shell: bash
        env:
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_prefix="ghcr.io/${owner}/sparrow"
          requested="${REQUESTED_IMAGE_TAG:-}"

          if [[ -n "${requested}" ]]; then
            if [[ ! "${requested}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::Invalid Docker image tag: ${requested}" >&2
              exit 1
            fi
            image_tag="${requested}"
          else
            image_tag="internal-sha-${GITHUB_SHA}"
          fi

          {
            echo "image_prefix=${image_prefix}"
            echo "image_tag=${image_tag}"
          } >> "${GITHUB_OUTPUT}"

          echo "Internal image prefix: ${image_prefix}"
          echo "Internal image tag: ${image_tag}"

      - name: Build all public server distributions
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :server:node-registry:installDist \
            :server:presence-directory:installDist \
            :server:push:installDist \
            :server:mailbox:installDist \
            :server:federation:installDist \
            :server:gateway:installDist \
            --no-daemon \
            --no-configuration-cache \
            --max-workers=2 \
            --console=plain

      - name: Publish complete internal server image set
        shell: bash
        env:
          IMAGE_PREFIX: ${{ steps.images.outputs.image_prefix }}
          IMAGE_TAG: ${{ steps.images.outputs.image_tag }}
        run: |
          set -euo pipefail

          created_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          context_root="${RUNNER_TEMP}/sparrow-internal-images"
          rm -rf "${context_root}"
          mkdir -p "${context_root}"

          services=(
            node-registry
            presence-directory
            push
            mailbox
            federation
            gateway
          )

          for service in "${services[@]}"; do
            distribution="server/${service}/build/install/${service}"
            if [[ ! -f "${distribution}/bin/${service}" ]]; then
              echo "::error::Missing server distribution ${distribution}." >&2
              exit 1
            fi

            context="${context_root}/${service}"
            mkdir -p "${context}/app" "${context}/data"
            cp -a "${distribution}/." "${context}/app/"
            touch "${context}/data/.keep"
            cp server/Dockerfile.runtime "${context}/Dockerfile"

            image="${IMAGE_PREFIX}-${service}"
            echo "Publishing ${image}:${IMAGE_TAG}"

            docker buildx build \
              --file "${context}/Dockerfile" \
              --platform linux/amd64,linux/arm64 \
              --build-arg "SERVICE=${service}" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.created=${created_at}" \
              --provenance=false \
              --push \
              --tag "${image}:${IMAGE_TAG}" \
              "${context}"
          done

      - name: Build public unified Sparrow server installer
        shell: pwsh
        env:
          IMAGE_PREFIX: ${{ steps.images.outputs.image_prefix }}
          IMAGE_TAG: ${{ steps.images.outputs.image_tag }}
          CONTROL_PLANE_RELEASE_DIRECTORY_URL: ${{ vars.CONTROL_PLANE_RELEASE_DIRECTORY_URL }}
          CONTROL_PLANE_DIRECTORY_PUBLIC_KEY: ${{ vars.CONTROL_PLANE_DIRECTORY_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./server/unified/New-SparrowServerBundle.ps1 `
              -OutputDirectory dist-internal-server `
              -ImagePrefix $env:IMAGE_PREFIX `
              -ImageTag $env:IMAGE_TAG

          $bundle = 'dist-internal-server/sparrow-server.zip'
          if (-not (Test-Path -LiteralPath $bundle -PathType Leaf)) {
              throw 'Unified Sparrow server bundle was not created.'
          }

      - name: Verify public bundle contents and directory-server exclusion
        shell: python
        run: |
          import sys
          import zipfile
          from pathlib import Path

          bundle = Path("dist-internal-server/sparrow-server.zip")
          required = {
              "Start-SparrowServer.cmd",
              "Start-SparrowServer.sh",
              "Start-SparrowServer.command",
              "Invoke-SparrowServer.py",
              "Manage-SparrowNodes.py",
              "control_plane_directory_client.py",
              "control_plane_directory_registration.py",
              "control_plane_directory_sync.py",
              "directory-registration/Dockerfile",
              "directory-sync/Dockerfile",
              "public-proxy/docker-compose.yml",
              "community-node/docker-compose.yml",
              "community-node/docker-compose.release.yml",
              "community-node/docker-compose.production.yml",
              "community-node/docker-compose.shared-proxy.yml",
              "community-node/docker-compose.directory-sync.yml",
              "control-plane/docker-compose.yml",
              "control-plane/docker-compose.release.yml",
              "control-plane/docker-compose.production.yml",
              "control-plane/docker-compose.shared-proxy.yml",
              "control-plane/docker-compose.firebase.yml",
          }
          forbidden_prefixes = (
              "control-plane-directory/",
              "server/control-plane-directory/",
          )
          forbidden_names = {
              "directory_service.py",
              "directory_admin_cli.py",
              "Build-SparrowDirectoryInstaller.py",
              "Start-SparrowDirectory.cmd",
              "Start-SparrowDirectory.ps1",
              "Start-SparrowDirectory.sh",
          }

          with zipfile.ZipFile(bundle) as archive:
              entries = {entry.filename.rstrip("/") for entry in archive.infolist()}

          missing = sorted(required - entries)
          if missing:
              print("Public unified server bundle is missing required files:", file=sys.stderr)
              for name in missing:
                  print(f"  - {name}", file=sys.stderr)
              raise SystemExit(1)

          leaked = sorted(
              name
              for name in entries
              if any(name.startswith(prefix) for prefix in forbidden_prefixes)
              or Path(name).name in forbidden_names
          )
          if leaked:
              print("Internal Control Plane Directory files leaked into the public bundle:", file=sys.stderr)
              for name in leaked:
                  print(f"  - {name}", file=sys.stderr)
              raise SystemExit(1)

          print(f"Validated {len(entries)} public bundle entries; internal Directory server is excluded.")

      - name: Build internal Control Plane Directory installers
        shell: bash
        run: |
          set -euo pipefail
          python3 server/control-plane-directory/Build-SparrowDirectoryInstaller.py \
            --output-dir dist-internal-directory

          test -s dist-internal-directory/sparrow-directory-windows.zip
          test -s dist-internal-directory/sparrow-directory-linux.zip

      - name: Prepare exactly two internal platform bundles
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-artifacts
          mkdir -p \
            dist-artifacts/windows/directory \
            dist-artifacts/linux/directory

          # Both platform downloads use the current unified Sparrow server payload.
          unzip -q dist-internal-server/sparrow-server.zip -d dist-artifacts/windows
          unzip -q dist-internal-server/sparrow-server.zip -d dist-artifacts/linux

          # INTERNAL build only: put the matching Directory installer INSIDE each
          # unified bundle. There is no separate Directory artifact.
          unzip -q dist-internal-directory/sparrow-directory-windows.zip \
            -d dist-artifacts/windows/directory
          unzip -q dist-internal-directory/sparrow-directory-linux.zip \
            -d dist-artifacts/linux/directory

          test -f dist-artifacts/windows/Start-SparrowServer.cmd
          test -f dist-artifacts/windows/directory/Start-SparrowDirectory.cmd
          test -f dist-artifacts/windows/directory/directory_service.py
          test -f dist-artifacts/linux/Start-SparrowServer.sh
          test -f dist-artifacts/linux/directory/Start-SparrowDirectory.sh
          test -f dist-artifacts/linux/directory/directory_service.py

      - name: Upload internal Windows unified + Directory bundle
        uses: actions/upload-artifact@v4
        with:
          name: sparrow-server-internal-windows
          path: dist-artifacts/windows
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Upload internal Linux unified + Directory bundle
        uses: actions/upload-artifact@v4
        with:
          name: sparrow-server-internal-linux
          path: dist-artifacts/linux
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Summarize internal build
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.images.outputs.image_tag }}
        run: |
          {
            echo "## Sparrow internal server build"
            echo
            echo "Server image tag: \`${IMAGE_TAG}\`"
            echo
            echo "Exactly two downloadable server artifacts:"
            echo "- Windows unified Sparrow server + internal Directory"
            echo "- Linux unified Sparrow server + internal Directory"
          } >> "${GITHUB_STEP_SUMMARY}"
