x-hardened-service: &hardened-service
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

# Container logs are size-limited: they must not keep request metadata indefinitely.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    logging: *default-logging
    depends_on:
      mailbox:
        condition: service_started
      federation:
        condition: service_started
      gateway:
        condition: service_started
    networks:
      - edge

  mailbox-database:
    logging: *default-logging
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/mailbox-database-password
    secrets:
      - mailbox-database-password
    networks:
      - backend

  mailbox:
    logging: *default-logging
    <<: *hardened-service
    image: ${SPARROW_IMAGE_PREFIX:?Missing SPARROW_IMAGE_PREFIX}-mailbox:${SPARROW_IMAGE_TAG:?Missing SPARROW_IMAGE_TAG}
    build: !reset null
    pull_policy: always
    ports: !reset []
    healthcheck: !reset null
    environment:
      TRUST_PROXY_HEADERS: "true"
      MAILBOX_DATABASE_PASSWORD: !reset null
      MAILBOX_DATABASE_PASSWORD_FILE: /run/secrets/mailbox-database-password
    secrets:
      - mailbox-database-password
    networks:
      - edge
      - backend
    depends_on:
      mailbox-database:
        condition: service_healthy

  federation:
    logging: *default-logging
    <<: *hardened-service
    image: ${SPARROW_IMAGE_PREFIX:?Missing SPARROW_IMAGE_PREFIX}-federation:${SPARROW_IMAGE_TAG:?Missing SPARROW_IMAGE_TAG}
    build: !reset null
    pull_policy: always
    ports: !reset []
    healthcheck: !reset null
    environment:
      TRUST_PROXY_HEADERS: "true"
    networks:
      - edge
      - backend
    depends_on:
      mailbox:
        condition: service_started

  gateway:
    logging: *default-logging
    <<: *hardened-service
    image: ${SPARROW_IMAGE_PREFIX:?Missing SPARROW_IMAGE_PREFIX}-gateway:${SPARROW_IMAGE_TAG:?Missing SPARROW_IMAGE_TAG}
    build: !reset null
    pull_policy: always
    ports: !reset []
    healthcheck: !reset null
    networks:
      - edge
      - backend
    depends_on:
      federation:
        condition: service_started

networks:
  edge:
  backend:
    internal: true

secrets:
  mailbox-database-password:
    file: ${MAILBOX_DATABASE_PASSWORD_FILE:?Missing MAILBOX_DATABASE_PASSWORD_FILE}
