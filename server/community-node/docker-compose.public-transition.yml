# In-place LAN -> public exposure. Existing node identity, database credentials,
# volumes and backend configuration remain unchanged; only the public edge,
# advertised URLs and local listener change.
# Container logs are size-limited: they must not keep request metadata indefinitely.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    logging: *default-logging
    ports: !override
      - "127.0.0.1:${COMMUNITY_NODE_HTTP_PORT:-8490}:80"
    networks:
      edge:
      public-edge:
        aliases:
          - sparrow-node-edge
  mailbox:
    logging: *default-logging
    networks:
      edge:
      backend:
      public-edge:
        aliases:
          - sparrow-node-mailbox
  federation:
    logging: *default-logging
    networks:
      edge:
      backend:
      public-edge:
        aliases:
          - sparrow-node-federation
  gateway:
    logging: *default-logging
    networks:
      edge:
      backend:
      public-edge:
        aliases:
          - sparrow-node-gateway
networks:
  public-edge:
    external: true
    name: sparrow-public-edge
