# In-place LAN -> public exposure. Existing node identity, database credentials,
# volumes and backend configuration remain unchanged; only the public edge,
# advertised URLs and local listener change.
services:
  caddy:
    ports: !override
      - "127.0.0.1:${COMMUNITY_NODE_HTTP_PORT:-8490}:80"
    networks:
      edge:
      public-edge:
        aliases:
          - sparrow-node-edge
  mailbox:
    networks:
      edge:
      backend:
      public-edge:
        aliases:
          - sparrow-node-mailbox
  federation:
    networks:
      edge:
      backend:
      public-edge:
        aliases:
          - sparrow-node-federation
  gateway:
    networks:
      edge:
      backend:
      public-edge:
        aliases:
          - sparrow-node-gateway
networks:
  public-edge:
    external: true
    name: sparrow-public-edge
