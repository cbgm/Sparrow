name: sparrow-network

x-node-b-service: &node-b-service
  restart: unless-stopped
  build:
    context: ..
    dockerfile: server/Dockerfile
  healthcheck:
    test: ["CMD-SHELL", "java -cp '/app/lib/*' com.cbgm.sparrow.server.observability.ReadinessProbe http://127.0.0.1:$${PORT}/health/ready"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 20s

# Container logs are size-limited: they must not keep request metadata indefinitely.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # In the multi-node topology, node A must advertise endpoints that node B can
  # resolve on the shared Docker network.
  federation:
    logging: *default-logging
    environment:
      CLIENT_ENDPOINT: ws://10.0.2.2:8094/v1/gateway
      MAILBOX_ENDPOINT: http://mailbox:8092

  mailbox-b-database:
    logging: *default-logging
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sparrow_mailbox_b
      POSTGRES_USER: sparrow_mailbox_b
      POSTGRES_PASSWORD: ${MAILBOX_B_DATABASE_PASSWORD:-local-development-password}
    ports:
      - "127.0.0.1:${MAILBOX_B_DATABASE_PORT:-5439}:5432"
    volumes:
      - mailbox-b-database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  mailbox-b:
    logging: *default-logging
    <<: *node-b-service
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        SERVICE: mailbox
    environment:
      PORT: 8092
      MAILBOX_DATABASE_URL: jdbc:postgresql://mailbox-b-database:5432/sparrow_mailbox_b
      MAILBOX_DATABASE_USER: sparrow_mailbox_b
      MAILBOX_DATABASE_PASSWORD: ${MAILBOX_B_DATABASE_PASSWORD:-local-development-password}
      MAILBOX_MAXIMUM_MAILBOXES: ${MAILBOX_MAXIMUM_MAILBOXES:-100000}
      MAILBOX_CREATION_WORK_BITS: ${MAILBOX_CREATION_WORK_BITS:-18}
    ports:
      - "127.0.0.1:8192:8092"
    depends_on:
      mailbox-b-database:
        condition: service_healthy

  federation-b:
    logging: *default-logging
    <<: *node-b-service
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        SERVICE: federation
    environment:
      PORT: 8093
      NODE_IDENTITY_PATH: /data/node.identity
      NODE_REGISTRY_URL: http://node-registry:8090
      CLIENT_ENDPOINT: ws://10.0.2.2:8294/v1/gateway
      MAILBOX_ENDPOINT: http://mailbox-b:8092
    ports:
      - "127.0.0.1:8193:8093"
    volumes:
      - node-b-identity:/data
    depends_on:
      node-registry:
        condition: service_healthy
      presence-directory:
        condition: service_healthy
      mailbox-b:
        condition: service_healthy

  gateway-b:
    logging: *default-logging
    <<: *node-b-service
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        SERVICE: gateway
    environment:
      PORT: 8094
      NODE_IDENTITY_PATH: /data/node.identity
      RELAY_PRIVATE_DESTINATIONS: ${RELAY_PRIVATE_DESTINATIONS:-true}
    # Direct host endpoint advertised to Android clients by the signed registry directory.
    ports:
      - "127.0.0.1:8294:8094"
    volumes:
      - node-b-identity:/data
    depends_on:
      federation-b:
        condition: service_healthy

volumes:
  node-b-identity:
  mailbox-b-database-data:
