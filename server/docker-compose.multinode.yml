name: securechat-network

x-node-b-service: &node-b-service
  restart: unless-stopped
  build:
    context: ..
    dockerfile: server/Dockerfile
  healthcheck:
    test: ["CMD-SHELL", "java -cp '/app/lib/*' com.cbgm.securechat.server.observability.ReadinessProbe http://127.0.0.1:$${PORT}/health/ready"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 20s

services:
  # In the multi-node topology, node A must advertise endpoints that node B can
  # resolve on the shared Docker network.
  federation:
    environment:
      CLIENT_ENDPOINT: ws://10.0.2.2:8094/v1/gateway
      FEDERATION_ENDPOINT: http://federation:8093
      MAILBOX_ENDPOINT: http://mailbox:8092

  mailbox-b-database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: securechat_mailbox_b
      POSTGRES_USER: securechat_mailbox_b
      POSTGRES_PASSWORD: ${MAILBOX_B_DATABASE_PASSWORD:-local-development-password}
    ports:
      - "127.0.0.1:${MAILBOX_B_DATABASE_PORT:-5439}:5432"
    volumes:
      - mailbox-b-database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  mailbox-b:
    <<: *node-b-service
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        SERVICE: mailbox
    environment:
      PORT: 8092
      MAILBOX_DATABASE_URL: jdbc:postgresql://mailbox-b-database:5432/securechat_mailbox_b
      MAILBOX_DATABASE_USER: securechat_mailbox_b
      MAILBOX_DATABASE_PASSWORD: ${MAILBOX_B_DATABASE_PASSWORD:-local-development-password}
      PUSH_INTERNAL_URL: http://push:8095
      PUSH_INTERNAL_API_TOKEN: ${PUSH_INTERNAL_API_TOKEN:-local-push-development-token}
      MAILBOX_MAXIMUM_MAILBOXES: ${MAILBOX_MAXIMUM_MAILBOXES:-100000}
      MAILBOX_MAXIMUM_MAILBOXES_PER_CLIENT: ${MAILBOX_MAXIMUM_MAILBOXES_PER_CLIENT:-100}
      MAILBOX_CREATION_RATE_LIMIT_REQUESTS: ${MAILBOX_CREATION_RATE_LIMIT_REQUESTS:-30}
      MAILBOX_CREATION_RATE_LIMIT_WINDOW_MILLISECONDS: ${MAILBOX_CREATION_RATE_LIMIT_WINDOW_MILLISECONDS:-3600000}
      MAILBOX_RATE_LIMIT_MAXIMUM_TRACKED_CLIENTS: ${MAILBOX_RATE_LIMIT_MAXIMUM_TRACKED_CLIENTS:-100000}
    ports:
      - "127.0.0.1:8192:8092"
    depends_on:
      mailbox-b-database:
        condition: service_healthy
      push:
        condition: service_healthy

  federation-b-database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: securechat_federation_b
      POSTGRES_USER: securechat_federation_b
      POSTGRES_PASSWORD: ${FEDERATION_B_DATABASE_PASSWORD:-local-development-password}
    ports:
      - "127.0.0.1:${FEDERATION_B_DATABASE_PORT:-5440}:5432"
    volumes:
      - federation-b-database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  federation-b:
    <<: *node-b-service
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        SERVICE: federation
    environment:
      PORT: 8093
      NODE_IDENTITY_PATH: /data/node.identity
      NODE_REGISTRY_URL: http://node-registry:8090
      PRESENCE_DIRECTORY_URL: http://presence-directory:8091
      GATEWAY_INTERNAL_URL: http://gateway-b:8094
      CLIENT_ENDPOINT: ws://10.0.2.2:8294/v1/gateway
      FEDERATION_ENDPOINT: http://federation-b:8093
      MAILBOX_ENDPOINT: http://mailbox-b:8092
      FEDERATION_INTERNAL_API_TOKEN: ${FEDERATION_B_INTERNAL_API_TOKEN:-local-federation-b-development-token}
      GATEWAY_INTERNAL_API_TOKEN: ${GATEWAY_B_INTERNAL_API_TOKEN:-local-gateway-b-development-token}
      FEDERATION_DATABASE_URL: jdbc:postgresql://federation-b-database:5432/securechat_federation_b
      FEDERATION_DATABASE_USER: securechat_federation_b
      FEDERATION_DATABASE_PASSWORD: ${FEDERATION_B_DATABASE_PASSWORD:-local-development-password}
      FEDERATION_INCOMING_RATE_LIMIT_REQUESTS: ${FEDERATION_INCOMING_RATE_LIMIT_REQUESTS:-1200}
      FEDERATION_INCOMING_RATE_LIMIT_WINDOW_MILLISECONDS: ${FEDERATION_INCOMING_RATE_LIMIT_WINDOW_MILLISECONDS:-60000}
      FEDERATION_RATE_LIMIT_MAXIMUM_TRACKED_CLIENTS: ${FEDERATION_RATE_LIMIT_MAXIMUM_TRACKED_CLIENTS:-100000}
    ports:
      - "127.0.0.1:8193:8093"
    volumes:
      - node-b-identity:/data
    depends_on:
      node-registry:
        condition: service_healthy
      presence-directory:
        condition: service_healthy
      mailbox-b:
        condition: service_healthy
      federation-b-database:
        condition: service_healthy

  gateway-b:
    <<: *node-b-service
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        SERVICE: gateway
    environment:
      PORT: 8094
      NODE_IDENTITY_PATH: /data/node.identity
      FEDERATION_INTERNAL_URL: http://federation-b:8093
      PUSH_INTERNAL_URL: http://push:8095
      PRESENCE_DIRECTORY_URL: http://presence-directory:8091
      FEDERATION_INTERNAL_API_TOKEN: ${FEDERATION_B_INTERNAL_API_TOKEN:-local-federation-b-development-token}
      GATEWAY_INTERNAL_API_TOKEN: ${GATEWAY_B_INTERNAL_API_TOKEN:-local-gateway-b-development-token}
      PUSH_INTERNAL_API_TOKEN: ${PUSH_INTERNAL_API_TOKEN:-local-push-development-token}
      ROUTE_LIFETIME_MILLISECONDS: 90000
      ROUTE_REFRESH_INTERVAL_MILLISECONDS: 30000
    # Direct host endpoint advertised to Android clients by the signed registry directory.
    ports:
      - "127.0.0.1:8294:8094"
    volumes:
      - node-b-identity:/data
    depends_on:
      federation-b:
        condition: service_healthy
      push:
        condition: service_healthy

volumes:
  node-b-identity:
  mailbox-b-database-data:
  federation-b-database-data:
