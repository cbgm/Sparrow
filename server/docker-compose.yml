name: sparrow-network

x-service: &sparrow-service
  restart: unless-stopped
  build:
    context: ..
    dockerfile: server/Dockerfile
  healthcheck:
    test: ["CMD-SHELL", "java -cp '/app/lib/*' com.cbgm.sparrow.server.observability.ReadinessProbe http://127.0.0.1:$${PORT}/health/ready"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 20s

services:
  node-registry-database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sparrow_registry
      POSTGRES_USER: sparrow_registry
      POSTGRES_PASSWORD: ${NODE_REGISTRY_DATABASE_PASSWORD:-local-development-password}
    ports:
      - "127.0.0.1:${NODE_REGISTRY_DATABASE_PORT:-5437}:5432"
    volumes:
      - node-registry-database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  node-registry:
    <<: *sparrow-service
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        SERVICE: node-registry
    environment:
      PORT: 8090
      REGISTRY_IDENTITY_PATH: /data/registry.identity
      NODE_REGISTRY_DATABASE_URL: jdbc:postgresql://node-registry-database:5432/sparrow_registry
      NODE_REGISTRY_DATABASE_USER: sparrow_registry
      NODE_REGISTRY_DATABASE_PASSWORD: ${NODE_REGISTRY_DATABASE_PASSWORD:-local-development-password}
      NODE_REGISTRY_REGISTRATION_RATE_LIMIT_REQUESTS: ${NODE_REGISTRY_REGISTRATION_RATE_LIMIT_REQUESTS:-30}
      NODE_REGISTRY_REGISTRATION_RATE_LIMIT_WINDOW_MILLISECONDS: ${NODE_REGISTRY_REGISTRATION_RATE_LIMIT_WINDOW_MILLISECONDS:-3600000}
      NODE_REGISTRY_HEARTBEAT_GRACE_MILLISECONDS: ${NODE_REGISTRY_HEARTBEAT_GRACE_MILLISECONDS:-5000}
      NODE_REGISTRY_HEARTBEAT_RATE_LIMIT_REQUESTS: ${NODE_REGISTRY_HEARTBEAT_RATE_LIMIT_REQUESTS:-180}
      NODE_REGISTRY_HEARTBEAT_RATE_LIMIT_WINDOW_MILLISECONDS: ${NODE_REGISTRY_HEARTBEAT_RATE_LIMIT_WINDOW_MILLISECONDS:-60000}
      NODE_REGISTRY_RATE_LIMIT_MAXIMUM_TRACKED_CLIENTS: ${NODE_REGISTRY_RATE_LIMIT_MAXIMUM_TRACKED_CLIENTS:-100000}
      TRUST_PROXY_HEADERS: "true"
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - registry-identity:/data
    depends_on:
      node-registry-database:
        condition: service_healthy

  presence-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${PRESENCE_REDIS_PASSWORD:-local-development-password}
    environment:
      REDISCLI_AUTH: ${PRESENCE_REDIS_PASSWORD:-local-development-password}
    ports:
      - "127.0.0.1:${PRESENCE_REDIS_PORT:-6380}:6379"
    volumes:
      - presence-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  presence-directory:
    <<: *sparrow-service
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        SERVICE: presence-directory
    environment:
      PORT: 8091
      NODE_REGISTRY_URL: http://node-registry:8090
      PRESENCE_REDIS_URL: redis://presence-redis:6379
      PRESENCE_REDIS_PASSWORD: ${PRESENCE_REDIS_PASSWORD:-local-development-password}
      PRESENCE_MAXIMUM_TTL_MILLISECONDS: 120000
    ports:
      - "127.0.0.1:8091:8091"
    depends_on:
      node-registry:
        condition: service_healthy
      presence-redis:
        condition: service_healthy

  mailbox-database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sparrow_mailbox
      POSTGRES_USER: sparrow_mailbox
      POSTGRES_PASSWORD: ${MAILBOX_DATABASE_PASSWORD:-local-development-password}
    ports:
      - "127.0.0.1:${MAILBOX_DATABASE_PORT:-5436}:5432"
    volumes:
      - mailbox-database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  mailbox:
    <<: *sparrow-service
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        SERVICE: mailbox
    environment:
      PORT: 8092
      MAILBOX_DATABASE_URL: jdbc:postgresql://mailbox-database:5432/sparrow_mailbox
      MAILBOX_DATABASE_USER: sparrow_mailbox
      MAILBOX_DATABASE_PASSWORD: ${MAILBOX_DATABASE_PASSWORD:-local-development-password}
      PUSH_INTERNAL_URL: http://push:8095
      PUSH_INTERNAL_API_TOKEN: ${PUSH_INTERNAL_API_TOKEN:-local-push-development-token}
      MAILBOX_MAXIMUM_MAILBOXES: ${MAILBOX_MAXIMUM_MAILBOXES:-100000}
      MAILBOX_MAXIMUM_MAILBOXES_PER_CLIENT: ${MAILBOX_MAXIMUM_MAILBOXES_PER_CLIENT:-100}
      MAILBOX_CREATION_RATE_LIMIT_REQUESTS: ${MAILBOX_CREATION_RATE_LIMIT_REQUESTS:-30}
      MAILBOX_CREATION_RATE_LIMIT_WINDOW_MILLISECONDS: ${MAILBOX_CREATION_RATE_LIMIT_WINDOW_MILLISECONDS:-3600000}
      MAILBOX_RATE_LIMIT_MAXIMUM_TRACKED_CLIENTS: ${MAILBOX_RATE_LIMIT_MAXIMUM_TRACKED_CLIENTS:-100000}
    ports:
      - "127.0.0.1:8092:8092"
    depends_on:
      mailbox-database:
        condition: service_healthy
      push:
        condition: service_healthy

  push-database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sparrow_push
      POSTGRES_USER: sparrow_push
      POSTGRES_PASSWORD: ${PUSH_DATABASE_PASSWORD:-local-development-password}
    ports:
      - "127.0.0.1:${PUSH_DATABASE_PORT:-5435}:5432"
    volumes:
      - push-database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  push:
    <<: *sparrow-service
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        SERVICE: push
    environment:
      PORT: 8095
      NODE_REGISTRY_URL: http://node-registry:8090
      PRESENCE_DIRECTORY_URL: http://presence-directory:8091
      PUSH_INTERNAL_API_TOKEN: ${PUSH_INTERNAL_API_TOKEN:-local-push-development-token}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
      PUSH_DATABASE_URL: jdbc:postgresql://push-database:5432/sparrow_push
      PUSH_DATABASE_USER: sparrow_push
      PUSH_DATABASE_PASSWORD: ${PUSH_DATABASE_PASSWORD:-local-development-password}
      PUSH_DEVICE_REGISTRATION_RATE_LIMIT_REQUESTS: ${PUSH_DEVICE_REGISTRATION_RATE_LIMIT_REQUESTS:-60}
      PUSH_DEVICE_REGISTRATION_RATE_LIMIT_WINDOW_MILLISECONDS: ${PUSH_DEVICE_REGISTRATION_RATE_LIMIT_WINDOW_MILLISECONDS:-60000}
      PUSH_RATE_LIMIT_MAXIMUM_TRACKED_CLIENTS: ${PUSH_RATE_LIMIT_MAXIMUM_TRACKED_CLIENTS:-100000}
    ports:
      - "127.0.0.1:8095:8095"
    volumes:
      - type: bind
        source: ${FIREBASE_ADMIN_CREDENTIALS:?Define FIREBASE_ADMIN_CREDENTIALS in server/.env}
        target: /run/secrets/firebase-admin.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      node-registry:
        condition: service_healthy
      push-database:
        condition: service_healthy

  federation-database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sparrow_federation
      POSTGRES_USER: sparrow_federation
      POSTGRES_PASSWORD: ${FEDERATION_DATABASE_PASSWORD:-local-development-password}
    ports:
      - "127.0.0.1:${FEDERATION_DATABASE_PORT:-5438}:5432"
    volumes:
      - federation-database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  federation:
    <<: *sparrow-service
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        SERVICE: federation
    environment:
      PORT: 8093
      NODE_IDENTITY_PATH: /data/node.identity
      NODE_REGISTRY_URL: http://node-registry:8090
      PRESENCE_DIRECTORY_URL: http://presence-directory:8091
      GATEWAY_INTERNAL_URL: http://gateway:8094
      CLIENT_ENDPOINT: ws://localhost:8094/v1/gateway
      FEDERATION_ENDPOINT: http://localhost:8093
      MAILBOX_ENDPOINT: http://localhost:8092
      FEDERATION_INTERNAL_API_TOKEN: ${FEDERATION_INTERNAL_API_TOKEN:-local-federation-development-token}
      GATEWAY_INTERNAL_API_TOKEN: ${GATEWAY_INTERNAL_API_TOKEN:-local-gateway-development-token}
      FEDERATION_DATABASE_URL: jdbc:postgresql://federation-database:5432/sparrow_federation
      FEDERATION_DATABASE_USER: sparrow_federation
      FEDERATION_DATABASE_PASSWORD: ${FEDERATION_DATABASE_PASSWORD:-local-development-password}
      FEDERATION_INCOMING_RATE_LIMIT_REQUESTS: ${FEDERATION_INCOMING_RATE_LIMIT_REQUESTS:-1200}
      FEDERATION_INCOMING_RATE_LIMIT_WINDOW_MILLISECONDS: ${FEDERATION_INCOMING_RATE_LIMIT_WINDOW_MILLISECONDS:-60000}
      FEDERATION_RATE_LIMIT_MAXIMUM_TRACKED_CLIENTS: ${FEDERATION_RATE_LIMIT_MAXIMUM_TRACKED_CLIENTS:-100000}
    ports:
      - "127.0.0.1:8093:8093"
    volumes:
      - node-identity:/data
    depends_on:
      node-registry:
        condition: service_healthy
      presence-directory:
        condition: service_healthy
      mailbox:
        condition: service_healthy
      federation-database:
        condition: service_healthy

  gateway:
    <<: *sparrow-service
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        SERVICE: gateway
    environment:
      PORT: 8094
      NODE_IDENTITY_PATH: /data/node.identity
      FEDERATION_INTERNAL_URL: http://federation:8093
      PUSH_INTERNAL_URL: http://push:8095
      PRESENCE_DIRECTORY_URL: http://presence-directory:8091
      FEDERATION_INTERNAL_API_TOKEN: ${FEDERATION_INTERNAL_API_TOKEN:-local-federation-development-token}
      GATEWAY_INTERNAL_API_TOKEN: ${GATEWAY_INTERNAL_API_TOKEN:-local-gateway-development-token}
      PUSH_INTERNAL_API_TOKEN: ${PUSH_INTERNAL_API_TOKEN:-local-push-development-token}
      ROUTE_LIFETIME_MILLISECONDS: 90000
      ROUTE_REFRESH_INTERVAL_MILLISECONDS: 30000
    ports:
      - "127.0.0.1:8094:8094"
    volumes:
      - node-identity:/data
    depends_on:
      federation:
        condition: service_healthy
      push:
        condition: service_healthy

volumes:
  registry-identity:
  node-identity:
  node-registry-database-data:
  presence-redis-data:
  mailbox-database-data:
  push-database-data:
  federation-database-data:
