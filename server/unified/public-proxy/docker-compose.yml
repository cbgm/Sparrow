name: sparrow-public-proxy
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../node-instances/routes:/etc/caddy/node-routes:ro
      - ../community-node/index.html:/srv/community-node/index.html:ro
      - ../control-plane/index.html:/srv/control-plane/index.html:ro
      - ../control-plane/directory-registration-proofs:/srv/control-plane/directory-proofs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - public-edge
  directory-register:
    # One-shot registration is started only by Install/Start and is never a
    # dependency of Caddy, the local Control Plane, or message routing.
    profiles: [registration]
    image: sparrow-directory-register:local
    build:
      context: ..
      dockerfile: directory-registration/Dockerfile
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Proofs are public, short-lived and written only to this dedicated mount.
    # The EXISTING identity is mounted as a SINGLE read-only file, never the
    # secrets directory or Docker socket. It cannot be generated by this job.
    volumes:
      - ../control-plane/secrets/registry-root.identity:/run/control-plane/registry-root.identity:ro
      - ../control-plane/directory-registration-proofs:/proofs
  directory-sync:
    # Optional discovery background worker: installer starts this separately.
    # A failed image build must not prevent the public proxy from starting.
    profiles: [directory]
    image: sparrow-directory-sync:local
    build:
      context: ..
      dockerfile: directory-sync/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - ../control-plane/sparrow.conf
    volumes:
      - control-plane-directory-cache:/cache/control-plane
      - node-directory-cache:/cache/node
    # Deliberately NO Docker socket, server identity keys, public ports, or
    # dependency edge to the Caddy proxy, gateway, and message backends.
networks:
  public-edge:
    external: true
    name: sparrow-public-edge
volumes:
  caddy-data:
  caddy-config:
  control-plane-directory-cache:
    name: sparrow-control-plane-directory-cache
  node-directory-cache:
    external: true
    name: sparrow-node-directory-cache
