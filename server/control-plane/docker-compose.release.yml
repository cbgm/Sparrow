services:
  registry-signing-init:
    profiles: ["init"]
    image: alpine:3.21
    restart: "no"
    user: "0:0"
    command:
      - sh
      - -c
      - chown -R 65532:65532 /data/signing && chmod 700 /data/signing
    volumes:
      - registry-signing:/data/signing

  caddy:
    depends_on:
      node-registry:
        condition: service_started
      presence-directory:
        condition: service_started
      push:
        condition: service_started

  node-registry:
    image: ${SECURECHAT_IMAGE_PREFIX:?Missing SECURECHAT_IMAGE_PREFIX}-node-registry:${SECURECHAT_IMAGE_TAG:?Missing SECURECHAT_IMAGE_TAG}
    build: !reset null
    pull_policy: always
    healthcheck: !reset null
    environment:
      REGISTRY_IDENTITY_PATH: !reset null
      REGISTRY_AUTHORITY_IDENTITY_PATH: /run/secrets/registry-authority.identity
      REGISTRY_AUTHORITY_CERTIFICATE_PATH: /run/secrets/registry-authority-certificate.json
      REGISTRY_SIGNING_IDENTITY_DIRECTORY: /data/signing
    secrets:
      - source: registry-authority-identity
        target: registry-authority.identity
      - source: registry-authority-certificate
        target: registry-authority-certificate.json
    volumes: !override
      - registry-signing:/data/signing

  presence-directory:
    image: ${SECURECHAT_IMAGE_PREFIX:?Missing SECURECHAT_IMAGE_PREFIX}-presence-directory:${SECURECHAT_IMAGE_TAG:?Missing SECURECHAT_IMAGE_TAG}
    build: !reset null
    pull_policy: always
    healthcheck: !reset null
    depends_on:
      node-registry:
        condition: service_started
      presence-redis:
        condition: service_healthy

  push:
    image: ${SECURECHAT_IMAGE_PREFIX:?Missing SECURECHAT_IMAGE_PREFIX}-push:${SECURECHAT_IMAGE_TAG:?Missing SECURECHAT_IMAGE_TAG}
    build: !reset null
    pull_policy: always
    healthcheck: !reset null
    depends_on:
      node-registry:
        condition: service_started
      push-database:
        condition: service_healthy

volumes:
  registry-signing:

secrets:
  registry-authority-identity:
    file: ${REGISTRY_AUTHORITY_IDENTITY_FILE:-./secrets/registry-authority.identity}
  registry-authority-certificate:
    file: ${REGISTRY_AUTHORITY_CERTIFICATE_FILE:-./secrets/registry-authority-certificate.json}
