site_name: Sparrow Documentation
site_description: Engineering documentation for Sparrow
site_author: Sparrow
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Why Sparrow?: why-sparrow.md
  - Technology Stack: technology-stack.md
  - Getting Started:
      - Introduction: getting-started/introduction.md
      - Installation: getting-started/installation.md
      - First Build: getting-started/first-build.md
      - Using the Android App: getting-started/using-app.md
      - Development Workflow: getting-started/development-workflow.md
      - Project Structure: getting-started/project-structure.md
  - Server & Operations:
      - Overview: server/overview.md
      - Control Plane: server/control-plane.md
      - Community Node: server/community-node.md
      - Docker & Troubleshooting: server/operations.md
      - Secrets: server/secrets.md
  - Architecture:
      - Overview: architecture/overview.md
      - Clean Architecture: architecture/clean-architecture.md
      - Dependency Rules: architecture/dependency-rules.md
      - Module Types: architecture/module-types.md
      - Messaging Boundary: architecture/messaging-boundary.md
      - "Chats: Direct & Group": architecture/chats.md
  - Features:
      - Current Feature Status: features/current-features.md
      - Chats: features/chats.md
      - Contacts: features/contacts.md
      - Identity: features/identity.md
      - Onboarding: features/onboarding.md
      - Messaging & Delivery Flow: features/message-transport-flow.md
      - Transport: features/transport.md
      - Push Notifications: push-notifications.md
  - Security:
      - Overview: security/overview.md
      - Identity: security/identity.md
      - Encryption: security/encryption.md
      - Transport: security/transport.md
      - Safety Numbers: security/safety-numbers.md
      - Threat Model: security/threat-model.md
  - API:
      - Gateway: api/gateway.md
      - WebSocket: api/websocket.md
      - Protocol: api/protocol.md
  - Development:
      - Local Development: development/local-development.md
      - Extending the Project: development/extending.md
      - Coding Style: development/coding-style.md
      - Logging: development/logging.md
      - Testing: development/testing.md
      - Contributing: development/contributing.md
      - Release Process: development/release-process.md
  - Generated Reference:
      - Overview: generated/index.md
      - Architecture: generated/architecture.md
      - Module Catalog: generated/modules.md
      - Dependency Matrix: generated/dependency-matrix.md
      - Statistics: generated/statistics.md
  - Design Decisions: design-decisions.md
  - Roadmap: roadmap.md
  - FAQ: faq.md
  - Glossary: glossary.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/extra.css

strict: true
